version: "3.8"

services:
  tf-serving:
    image: tensorflow/serving:latest
    container_name: clothsnap-tf-serving
    ports:
      - "8501:8501"
    volumes:
      - ./models/tf_serving_ready_model:/models/clothsnap/1
    command: >
      --rest_api_port=8501
      --model_name=clothsnap
      --model_base_path=/models/clothsnap
    restart: unless-stopped
