version: "3.8"

services:
  tf-serving:
    image: tensorflow/serving:latest
    container_name: clothsnap-tf-serving-local
    ports:
      - "8501:8501"
    volumes:
      - ./models/tf_serving_ready_model:/models/clothsnap/1
    command: >
      --rest_api_port=8501
      --model_name=clothsnap
      --model_base_path=/models/clothsnap
    restart: unless-stopped

  flask:
    build:
      context: .
      dockerfile: Dockerfile.flask
    image: clothsnap-flask:latest
    container_name: clothsnap-flask-local
    environment:
      - CLOTHSNAP_TF_URL=http://tf-serving:8501/v1/models/clothsnap:predict
      - PORT=5001
    depends_on:
      - tf-serving
    ports:
      - "5001:5001"
    restart: unless-stopped
