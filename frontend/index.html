<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClothSnap Predictor</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --accent: #38bdf8;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, #1e293b, #0f172a 50%),
                  radial-gradient(circle at 80% 0%, #0ea5e9, transparent 25%),
                  var(--bg);
      color: var(--text);
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 12px; letter-spacing: 0.3px; }
    p { margin: 0 0 16px; color: var(--muted); line-height: 1.5; }
    .upload {
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .upload:hover {
      border-color: var(--accent);
      background: rgba(56,189,248,0.05);
    }
    input[type="file"] { margin: 12px auto; display: block; color: var(--text); }
    button {
      background: linear-gradient(120deg, #38bdf8, #0ea5e9);
      color: #0b1224;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 10px 30px rgba(14,165,233,0.3); }
    button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
    .preview { margin-top: 16px; max-width: 100%; border-radius: 12px; }
    .results { margin-top: 16px; padding: 12px; background: rgba(255,255,255,0.04); border-radius: 10px; }
    .badge { display: inline-block; margin-right: 8px; padding: 6px 10px; border-radius: 8px; background: rgba(56,189,248,0.18); color: #e0f2fe; }
    .error { color: #fda4af; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ClothSnap Predictor</h1>
    <p>Upload a clothing image to get the top predictions. Uses TensorFlow Serving behind the scenes.</p>

    <form id="upload-form" class="upload">
      <input type="file" name="file" accept="image/*" required />
      <button type="submit">Predict</button>
    </form>

    <img id="preview" class="preview" alt="" />
    <div id="results" class="results"></div>
  </div>

  <script>
    const form = document.getElementById("upload-form");
    const preview = document.getElementById("preview");
    const results = document.getElementById("results");
    const fileInput = form.querySelector('input[type="file"]');

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (file) preview.src = URL.createObjectURL(file);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;
      const data = new FormData();
      data.append("file", file);
      const btn = form.querySelector("button");
      btn.disabled = true;
      results.textContent = "Predicting...";

      try {
        const resp = await fetch("/predict", { method: "POST", body: data });
        const json = await resp.json();
        if (!resp.ok) throw new Error(json.error || "Request failed");
        if (!json.results || !json.results.length) throw new Error("No results");
        results.innerHTML = json.results
          .map(r => `<span class="badge">${r.label}</span> ${(r.confidence * 100).toFixed(1)}%`)
          .join("<br>");
      } catch (err) {
        results.innerHTML = `<span class="error">Error: ${err.message}</span>`;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
