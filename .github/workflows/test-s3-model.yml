name: Test Private S3 Model Access

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-s3-access:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Parse MODEL_URL into bucket and key
        id: parse
        run: |
          URL="${{ vars.MODEL_URL }}"

          # Extract bucket name (everything before ".s3")
          BUCKET=$(echo "$URL" | sed -E 's@https://([^\.]+)\.s3.*@\1@')
          echo "bucket=$BUCKET" >> $GITHUB_OUTPUT

          # Extract key (everything after the domain)
          KEY=$(echo "$URL" | sed -E 's@https://[^/]+\.com/@@')
          echo "key=$KEY" >> $GITHUB_OUTPUT

          # Extract prefix (folder only)
          PREFIX=$(dirname "$KEY")
          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT

      - name: Print parsed values
        run: |
          echo "Bucket: ${{ steps.parse.outputs.bucket }}"
          echo "Key:    ${{ steps.parse.outputs.key }}"
          echo "Prefix: ${{ steps.parse.outputs.prefix }}"

      - name: List S3 folder
        run: |
          aws s3 ls s3://${{ steps.parse.outputs.bucket }}/${{ steps.parse.outputs.prefix }}/

      - name: Download model file
        run: |
          aws s3 cp \
            s3://${{ steps.parse.outputs.bucket }}/${{ steps.parse.outputs.key }} \
            ./model.tar.gz

      - name: Verify downloaded file
        run: ls -lh ./model.tar.gz
