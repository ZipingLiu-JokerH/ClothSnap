name: Build, Push, and Deploy Clothsnap

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: zipingliu-jokerh
  IMAGE_NAME_FLASK: clothsnap-flask
  IMAGE_NAME_TFSERVING: clothsnap-tfserving

jobs:
  build-push-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Download model artifact
        run: aws s3 cp "${{ vars.MODEL_URI }}" model.tar.gz

      - name: Docker login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build Flask image
        run: |
          docker build \
            -f Dockerfile.flask \
            -t "$REGISTRY/${OWNER}/${IMAGE_NAME_FLASK}:latest" \
            .

      - name: Build TF Serving image (model baked in)
        run: |
          docker build \
            -f Dockerfile.tfserving \
            --build-arg MODEL_TAR=model.tar.gz \
            -t "$REGISTRY/${OWNER}/${IMAGE_NAME_TFSERVING}:latest" \
            .

      - name: Push images
        run: |
          docker push "$REGISTRY/${OWNER}/${IMAGE_NAME_FLASK}:latest"
          docker push "$REGISTRY/${OWNER}/${IMAGE_NAME_TFSERVING}:latest"

      - name: Deploy on EC2 over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Ensuring Docker is running"
            sudo systemctl start docker || true

            cd /home/ubuntu/clothsnap

            echo "Taking app down to free resources"
            docker compose down || true

            echo "Cleaning Docker resources with docker system prune -af"
            docker system prune -af || true

            echo "Pulling latest images from GHCR..."
            docker compose pull

            echo "Starting app with docker compose up -d..."
            docker compose up -d

            echo "Deployment complete."
